# Disposable synthetic data only. No volumes, external credentials or providers.
# docker compose -f compose.staging.yaml up -d --wait
# STAGING_DATABASE_URL=postgres://postgres:synthetic-ci-only@127.0.0.1:55432/prospectpilot_test
# docker compose -f compose.staging.yaml down
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_DB: prospectpilot_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prospectpilot_test"]
      interval: 2s
      timeout: 5s
      retries: 30
