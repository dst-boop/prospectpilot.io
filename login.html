<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account or sign in · ProspectPilot</title><style>
body{margin:0;background:#101e35;color:#eef4ff;font:16px/1.5 system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(420px,calc(100vw - 80px));margin:24px;padding:28px;border:1px solid #38516f;border-radius:16px;background:#182c49}h1{font-size:30px;margin:0}h2{font-size:21px}button,input{font:inherit;box-sizing:border-box;width:100%;padding:12px;border-radius:7px}button{background:#c6e4ff;color:#101e35;border:0;font-weight:600;cursor:pointer;margin:6px 0}button:disabled{opacity:.6}input{margin:5px 0 14px;border:1px solid #657e9f;background:#fff;color:#14243f}label{display:block;font-size:14px}button.secondary{background:transparent;color:#c6e4ff;border:1px solid #657e9f}.switch{display:flex;gap:8px}.switch button[aria-pressed=true]{background:#c6e4ff;color:#101e35}[role=status]{font-size:14px;min-height:24px}button:focus-visible,input:focus-visible{outline:3px solid #96c7ff;outline-offset:3px}hr{border:0;border-top:1px solid #38516f;margin:20px 0}[hidden]{display:none!important}
</style></head><body><main><h1>ProspectPilot</h1><p>Your contacts. Your workspace.</p><button id="google" type="button">Continue with Google</button><p>New here? Google sign-in creates your account automatically.</p><hr><div class="switch"><button id="signInMode" type="button" class="secondary" aria-pressed="true">Sign in</button><button id="signUpMode" type="button" class="secondary" aria-pressed="false">Create account</button></div><h2 id="formTitle">Sign in with email</h2><form id="emailForm"><label>Email address<input id="email" type="email" autocomplete="email" required maxlength="254"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"></label><button id="submitEmail" type="submit">Sign in</button></form><button id="resetPassword" type="button" class="secondary">Forgot password?</button><button id="resendVerification" type="button" class="secondary" hidden>Resend verification email</button><p role="status" aria-live="polite"></p></main><script type="module" src="/auth/login.js"></script></body></html>
