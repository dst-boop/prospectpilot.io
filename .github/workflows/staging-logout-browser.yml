name: fictional staging logout browser
on:
  pull_request:
permissions:
  contents: read
jobs:
  staging-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --prefix /tmp/pp-browser playwright@1.62.1
      - run: /tmp/pp-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/staging-logout-visual-ci.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fictional-staging-logout-browser
          path: /tmp/staging-logout-browser/
