name: distinct successor diagnostic rehearsal
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: two-image-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: prospectpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Two independently built pinned images, synthetic data only
        run: node scripts/two-image-rehearsal.mjs --postgres
        env:
          STAGING_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
