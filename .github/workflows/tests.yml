name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: prospectpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
        env:
          POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - name: Check out the reviewed PR99 rollback contract (exact head)
        uses: actions/checkout@v7
        with:
          ref: 3ba8bdbe55105fc0b9c83e2e3307966aa6499109
          path: .tmp/networking-rollback-contract
          persist-credentials: false
      - name: Install the pinned contract's test dependencies
        run: pnpm --dir .tmp/networking-rollback-contract install --frozen-lockfile --ignore-scripts
      - name: Gate candidate deletion and its own identity callback on native PostgreSQL
        run: |
          set -euo pipefail
          test "$(git -C .tmp/networking-rollback-contract rev-parse HEAD)" = 3ba8bdbe55105fc0b9c83e2e3307966aa6499109
          node .tmp/networking-rollback-contract/scripts/verify-networking-rollback.mjs \
            --forget-module "$GITHUB_WORKSPACE/forget.mjs" \
            --contact-keys-module "$GITHUB_WORKSPACE/prospect-workspace.mjs"
        env:
          POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: for script in release.sh setup-research-worker.sh setup-plan-catalog.sh setup-plan-catalog-schedule.sh; do bash -n "$script"; done
      - name: Build the production image
        run: docker build -t prospectpilot-ci .
      - name: Verify Python HTTPS trust store in runtime
        run: docker run --rm --entrypoint python3 prospectpilot-ci -c "import ssl; assert ssl.create_default_context().cert_store_stats()['x509_ca'] > 0, 'System CA certificates are missing'"
      - name: Gate code extracted from the built compatibility image on native PostgreSQL
        env:
          POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
        run: |
          set -euo pipefail
          image_id=$(docker image inspect --format '{{.Id}}' prospectpilot-ci)
          container=$(docker create prospectpilot-ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/rollback-image"
          docker cp "$container:/app/." "$RUNNER_TEMP/rollback-image/"
          echo "candidate_commit=$(git rev-parse HEAD)" > .tmp/rollback-image-evidence.txt
          echo "ci_local_image_id=$image_id" >> .tmp/rollback-image-evidence.txt
          echo "contract_commit=3ba8bdbe55105fc0b9c83e2e3307966aa6499109" >> .tmp/rollback-image-evidence.txt
          node .tmp/networking-rollback-contract/scripts/verify-networking-rollback.mjs \
            --forget-module "$RUNNER_TEMP/rollback-image/forget.mjs" \
            --contact-keys-module "$RUNNER_TEMP/rollback-image/prospect-workspace.mjs" \
            | tee -a .tmp/rollback-image-evidence.txt
      - name: Save compatibility image test evidence (not production provenance)
        uses: actions/upload-artifact@v7
        with:
          name: rollback-compatibility-evidence
          path: .tmp/rollback-image-evidence.txt
          include-hidden-files: true
          if-no-files-found: error
