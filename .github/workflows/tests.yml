name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: prospectpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Full 029-to-032 upgrade and PR100 rollback rehearsal
        run: pnpm upgrade:postgres
        env:
          STAGING_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - name: Isolated PostgreSQL staging smoke (no external providers)
        run: pnpm staging:postgres
        env:
          STAGING_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - run: pnpm test
        env:
          POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - name: Gate networking rollback privacy on disposable PostgreSQL
        run: node scripts/verify-networking-rollback.mjs
        env:
          POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: for script in release.sh setup-research-worker.sh setup-plan-catalog.sh setup-plan-catalog-schedule.sh; do bash -n "$script"; done
      - name: Read-only fallback browser search and paging
        run: |
          npm install --prefix /tmp/pp-browser --no-save --ignore-scripts playwright@1.58.2
          /tmp/pp-browser/node_modules/.bin/playwright install --with-deps chromium
          node scripts/readonly-visual-ci.mjs
        env:
          STAGING_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readonly-browser
          path: /tmp/readonly-*.png
          if-no-files-found: ignore
      - name: Build the production image
        run: docker build -t prospectpilot-ci .
      - name: Exact runtime image read-only activation and recovery
        run: |
          IMAGE_ID=$(docker image inspect prospectpilot-ci --format '{{.Id}}')
          echo "READONLY_REHEARSAL_IMAGE=$IMAGE_ID"
          docker run --rm --network host --read-only --tmpfs /tmp -e STAGING_DATABASE_URL=postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test --entrypoint node "$IMAGE_ID" scripts/verify-readonly-image.mjs --synthetic-image
      - name: Verify Python HTTPS trust store in runtime
        run: docker run --rm --entrypoint python3 prospectpilot-ci -c "import ssl; assert ssl.create_default_context().cert_store_stats()['x509_ca'] > 0, 'System CA certificates are missing'"
