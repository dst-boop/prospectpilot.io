name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: for script in release.sh setup-research-worker.sh setup-plan-catalog.sh setup-plan-catalog-schedule.sh; do bash -n "$script"; done
      - name: Build the production image
        run: docker build -t prospectpilot-ci .
      - name: Verify Python HTTPS trust store in runtime
        run: docker run --rm --entrypoint python3 prospectpilot-ci -c "import ssl; assert ssl.create_default_context().cert_store_stats()['x509_ca'] > 0, 'System CA certificates are missing'"
