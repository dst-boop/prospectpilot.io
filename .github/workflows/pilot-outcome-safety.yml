name: pilot outcome safety browser
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pilot-outcome-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node build.mjs
      - run: npm install --prefix /tmp/pp-browser playwright@1.62.1
      - run: /tmp/pp-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/pilot-outcome-safety-browser.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pilot-outcome-safety-screenshots
          path: /tmp/pilot-*.png
