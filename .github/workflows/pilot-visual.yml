name: synthetic pilot browser
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --prefix /tmp/pp-browser playwright@1.62.1
      - run: /tmp/pp-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/pilot-visual-ci.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthetic-pilot-screenshots
          path: /tmp/pilot-*.png
