name: historical identity safety
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: historical-identities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: prospectpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/prospectpilot_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Full native application regressions (not rollback approval)
        run: pnpm test
      - name: Browser dependencies
        run: |
          npm install --prefix /tmp/pp-browser --no-save --ignore-scripts playwright@1.58.2
          /tmp/pp-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Explicit historical identity review browser flow
        run: node scripts/historical-identity-visual-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-identity-browser
          path: /tmp/historical-*.png
